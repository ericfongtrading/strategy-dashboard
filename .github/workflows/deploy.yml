name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Live strategy data is fetched from raw.githubusercontent at runtime, so a
    # data refresh needs no rebuild. The Hyper bot republishes its book whenever
    # a plan, a fill or a trade changes; without this, every one of those would
    # queue a Pages build against a soft limit of roughly ten per hour and the
    # page would end up further behind than it was on a weekly cron.
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure Pages
        # Provisions the Pages site on first run so deploy-pages doesn't 404.
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build (static export)
        env:
          # If your repo is at https://<user>.github.io/<repo>/, set this to "/<repo>".
          # For a user/organization site (https://<user>.github.io/) leave it blank.
          NEXT_PUBLIC_BASE_PATH: /strategy-dashboard
        run: npm run build
      - name: Add .nojekyll
        run: touch ./out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
